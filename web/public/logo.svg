<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 360 96" role="img" aria-label="La tienda de María">
  <defs><clipPath id="ball"><circle cx="44" cy="46" r="30"/></clipPath></defs>
  <!-- ovillo -->
  <circle cx="44" cy="46" r="30" fill="#C2553F"/>
  <g clip-path="url(#ball)" fill="none" stroke="#F6DCCB" stroke-width="3" stroke-linecap="round">
    <path d="M12 32 C 32 44, 54 44, 78 28"/>
    <path d="M10 48 C 32 62, 56 62, 80 44"/>
    <path d="M14 66 C 34 77, 56 74, 76 60"/>
    <path d="M29 12 C 18 34, 21 58, 38 82"/>
    <path d="M49 12 C 38 34, 41 58, 58 81"/>
  </g>
