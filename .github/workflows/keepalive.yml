name: Supabase keepalive

# El plan gratuito de Supabase pausa proyectos tras 7 días sin actividad.
on:
  schedule:
    - cron: '17 8 */3 * *'   # cada 3 días
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consulta ligera a la API
        run: |
          curl -fsS "${{ vars.SUPABASE_URL }}/rest/v1/settings?select=id&id=eq.1" \
            -H "apikey: ${{ vars.SUPABASE_ANON_KEY }}" > /dev/null
